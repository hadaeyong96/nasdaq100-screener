# config.yaml — 나스닥 100 MACD 스크리너 설정·가정값
#
# docs/strategy_v3.md 3장(지표 설정), 9장(지표 계산식), 12장(가정값)을 그대로 옮긴다.
# core/의 함수는 이 파일의 값만 읽고, 지표 상수를 코드에 하드코딩하지 않는다.

# ── 지표 설정 (3장, 9장) ──────────────────────────────────────────────
indicators:
  macd:
    fast: 12
    slow: 26
    signal: 9

  rsi:
    period: 14 # Wilder 평활 (alpha = 1/period)

  ichimoku:
    tenkan: 9 # 전환선
    kijun: 26 # 기준선
    senkou_b: 52 # 선행스팬 B

  # [가정] 일목 이동 칸수 D. 기본 26, 트레이딩뷰는 26일 이동을 실제로 25칸으로
  # 그리므로 차트 대조 후 25로 바뀔 수 있다 (12장, 9장 "구현 주의점").
  ichimoku_shift: &ichimoku_shift 26

  volume_ma:
    period: 20 # 20일 평균 거래량 대비 배수

  swing_low:
    # [가정] 스윙 저점(손절 기준) 기간. 검증 범위: 5 / 10 / 20거래일 (12장).
    period: &swing_low_period 10

  bollinger:
    period: 20
    std_mult: 2
    percentile_period: 120 # 밴드폭 백분위 계산 기간

# ── 데이터 수집 (7장, 데이터·지표 규칙) ───────────────────────────────
data:
  history_days: 300 # 종목당 최소 수집 거래일 (전략 문서 권장치)
  # "확정 거래일" 추정은 NYSE 거래일 달력(data/market_calendar.py, pandas_market_calendars)을
  # 쓴다. 주말·공휴일·조기 폐장(반나절장)을 모두 반영한다 (P3.2 2번).

# ── 12장 가정값 10개 (대본에 수치가 없어 임시로 정한 값, 백테스트로 확정) ──
assumptions:
  # 1. A1(RSI 30 탈출) 후 A2(MACD 골든크로스)가 나와야 하는 유효기간.
  #    검증 범위: 5 / 10 / 15거래일.
  a1_to_a2_expiry_days: 10

  # 2. S등급(신뢰 높음) 정규화 MACD 하한. 검증 범위: -0.3 ~ -1.0%.
  s_grade_macd_norm_min_pct: -0.5

  # 3. B등급(신뢰 낮음) 정규화 MACD 상한. 검증 범위: -1.5 ~ -3.0%.
  b_grade_macd_norm_max_pct: -2.0

  # 4. A3 진입 방식: 돌파형(breakout) 또는 되돌림형(pullback).
  #    백테스트 후 확정 (미결정, 문서 4장).
  a3_entry_mode: breakout

  # 5. 당일 시가 갭 필터. 검증 범위: 3 / 4 / 6%.
  gap_filter_pct: 4.0

  # 6. 스윙 저점 기간 (indicators.swing_low.period와 동일 값).
  #    검증 범위: 5 / 10 / 20거래일.
  swing_low_period: *swing_low_period

  # 7. B형(추세 재진입) 위험 예산, 계좌 대비. 검증 범위: 0.5 / 1 / 2%.
  b_type_risk_budget_pct: &b_type_risk_budget_pct 1.0

  # 8. 휩소 필터: 최근 20거래일 MACD 교차 횟수가 이 값 이상이면 제외.
  #    검증 범위: 3 / 4 / 5회.
  whipsaw_max_crosses_20d: 4

  # 9. 청산(대기 복귀) 후 재진입 대기 기간. 검증 범위: 0 / 5 / 10거래일.
  reentry_cooldown_days: 5

  # 10. 일목 이동 칸수 D (indicators.ichimoku_shift와 동일 값).
  #     검증 범위: 25 / 26, 트레이딩뷰 대조 후 확정.
  ichimoku_shift: *ichimoku_shift

# ── 전략 고정값 (4·5·7장) ───────────────────────────────────────────────
# 전략 문서가 정한 값이라 [가정]은 아니지만, 코드 곳곳에 숫자로 박혀 있던 것을 여기 한 곳으로
# 모았다 (2026-10-06, feat/why-explain). 기본값은 문서 값 그대로다. core.signals.levels()가 읽는다.
strategy_levels:
  rsi_oversold: 30 # A1 상향 돌파선, A2 RSI 하한
  rsi_mid: 50 # A3·B RSI 하한, E2 하향 이탈선
  rsi_overbought: 70 # A2·B RSI 상한, 골든크로스 날 매매 금지, 과열 해소 경고
  cross_window_days: 20 # MACD 교차(골든+데드) 집계 기간 — 휩소 필터·A등급 판정
  grade_a_max_crosses: 1 # A등급 "첫 골든크로스": 최근 cross_window_days 교차 이 값 이하
  earnings_filter_trading_days: 3 # 실적 발표 이 거래일 이내면 신규 매수 금지

# ── 계좌 (P2, 6장 / P3.6 6-1번) ────────────────────────────────────────
# equity_usd는 P3.6에서 제거했다. 달러 계산이 필요하면 total_krw ÷ 환율(data/fx.py)로 구한다.
account:
  total_krw: 40000000 # 실제 계좌 크기(원, 2026-09-28 확인). 백테스트 사이징 버그(KJB-1.1)
  # 감사 중 발견: 이 값이 1억원으로 남아 있던 동안 live 추천 수량이 실제 계좌(4천만원)의
  # 2.5배 기준으로 계산됐다(예: 9/25 BKNG 3주 -> 정정 후 1주). backtest.total_krw(아래
  # backtest: 항목)와 반드시 같은 값으로 맞춰 둔다 — engine/backtest.py의 simulate_portfolio가
  # 이제 이 둘이 다르면 바로 멈춘다.

# ── 자금 계획 (P3.6 6-1번) ───────────────────────────────────────────────
# 신호 종목에 쓸 수 있는 최대 비중과 슬롯 배분. 나머지(현금 버퍼 제외분)는 QQQM.
plan:
  strategy_limit_pct: 60 # 전략 한도(%) — 총자금 중 신호 종목에 쓸 수 있는 최대 비중
  cash_buffer_pct: 5 # 현금 버퍼(%) — QQQM으로도 넣지 않고 남겨 두는 비중
  max_slots: 8 # 최대 보유 종목 수 (risk.max_concurrent_positions와 동일 값)

# ── 위험 예산·한도 (P2, 6장) ────────────────────────────────────────────
# 한 종목의 총 위험은 계좌의 2%로 제한하고, 이 예산을 1:2:6(합 9) 비율로 나눈다.
# 6장 표의 0.22%/0.44%/1.33%는 2% × (1|2|6)/9의 반올림 표기다. 6장 "계산 예시"
# 표(A1 37주·A2 49주·A3 148주)를 정확히 재현하려면 반올림 전 정밀값이 필요해
# 여기서는 정밀값을 쓰고 주석에 반올림 표기를 남긴다(P2 완료 보고에 기록).
risk:
  a1_budget_pct: 0.2222222222222222 # ≈0.22% (2% × 1/9)
  a2_budget_pct: 0.4444444444444444 # ≈0.44% (2% × 2/9)
  a3_budget_pct: 1.3333333333333333 # ≈1.33% (2% × 6/9)
  b_budget_pct: *b_type_risk_budget_pct # 1.00% (B형, 위 assumptions와 동일 값)
  gap_buffer_pct: 1.5 # 갭 여유 (11장) — 손절이 하락 갭으로 밀려도 대비
  min_risk_per_share_pct: 1.0 # 주당 위험이 매수가의 이 비율 미만이면 이 값으로 올림
  max_position_pct: 25 # 종목당 투입 금액 한도 (계좌 대비)
  max_concurrent_positions: 8 # 동시 보유 종목 최대 수

# ── 진입 방식 (P2, 4장·11장) ────────────────────────────────────────────
entry:
  limit_markup: 1.01 # 매수 지정가 = 신호일 종가 × 이 값

# ── A3 진입 방식 (P2, 4장) ───────────────────────────────────────────────
a3:
  mode: breakout # breakout(돌파형, 기본값) | pullback(되돌림형) — 백테스트 후 확정
  pullback_tolerance_pct: 0.5 # 되돌림형: 저가가 구름 상단/기준선의 이 비율 이내로 근접

# ── 되돌려 보기(replay) (P2, engine/daily.py) ────────────────────────────
# --replay 플래그를 줬을 때만 쓰는 테스트·백테스트(P5)용 경로다. P3부터 운용
# 시작(기본 경로, --replay 없이 실행)은 오늘부터 시작하고 이 값을 쓰지 않는다.
replay:
  lookback_days: 60 # state.db가 비어 있을 때 상태를 만들기 위해 되돌려 보는 거래일 수
  live_rebuild_warmup_days: 60 # [가정] 라이브 체결 소급 반영 시 가장 이른 체결일보다 이만큼 앞 거래일부터 다시 계산

# ── 운용 모드 (P3) ────────────────────────────────────────────────────────
# live: 보유는 오직 data/fills.csv의 실제 체결 기록으로만 만든다 (가상 체결 없음).
# paper: 추천대로 체결됐다고 가정하는 모의 운용. DB를 data/paper_state.db로 분리한다.
# engine/daily.py --mode 인자가 이 값보다 우선한다.
mode: live

# ── 계획 탭 자동 기록 v2 (L3/B4, docs/design/auto_plan.md) ─────────────────
# live 모드에서 시트 "투자현황" 탭(총 투자금·종목당 계획금액)을 읽어, 계획 없는 추천에도 기본 금액으로
# 수량을 붙이고, 첫 매수 후 계획 탭에 없는 종목의 계획 줄을 빈 줄에 자동으로 쓴다.
# 금액은 시트 투자현황 탭 값만 쓴다(여기 두지 않음). enabled: false면 이 기능이 없던 때와 같은 동작.
# paper 모드는 쓰지 않는다.
live:
  auto_plan:
    enabled: false # 2026-10-22 새 출발: 프로그램은 사용자 시트에 아무것도 쓰지 않는다(계획 탭 삭제)
  # 2026-10-22 새 출발: 사용자 시트는 「QQQM 모으기」만 읽기 전용. 계획·체결 탭을 읽지 않는다(체결 없음 = 종목 매매 기록 없음으로 계산)
  sheet_plan_fills: false

# ── 아침 편지 (2026-10-22 새 출발) ──────────────────────────────────────────
letter:
  show_books: false # true면 [3 가상 장부] 칸·전략 표 접기를 다시 보임(새 장부를 다시 쓸 때)

# ── 저축일 알림 (2026-10-22, 개인판만) ────────────────────────────────────────
# 매달 이 날(1~31, 주말·휴장이면 다음 NYSE 거래일) 「오늘 할 일」을 "저축일 — 들어온 돈 오늘 바로 매수(…)"로. 빈칸이면 지금처럼.
savings_day: 17

# ── 상승장 대형주 웅덩이 v3.1 가상 1억 장부 (2026-10-23, docs/prereg/puddle_v31_forward.md, 태그 puddle-v31-prereg) ─────
# 규칙 값은 사전 등록대로 core/puddle_v31.Params에 고정(수정 = 새 장부). 여기는 운영 값만.
# 시작일·시작 환율: main 병합 뒤 첫 정규 실행(GitHub Actions)이 DB에 고정 → 그 뒤 여기에 적는다(값이 있으면 이것이 우선).
puddle_v31:
  enabled: true
  start_date: "" # 첫 정규 실행 뒤 고정 (YYYY-MM-DD)
  start_fx: "" # 첫 정규 실행 뒤 고정 (원/달러)
  sheet_id_env: GOOGLE_SHEETS_ID # 사용자 시트 — 「웅덩이 v3.1 (가상)」 탭에만 쓴다

# ── 사용자 시트 「전략공장」의 「QQQM 모으기」 탭 (2026-10-22, 읽기 전용 — data/holdings.py) ─────────────
# 2행 머리글 이름으로 열을 찾고 값은 3행(지금 B3·C3·D3·K3). 위치가 바뀌어도 이름이 같으면 읽는다.
# ISA 줄(2026-10-23): A열 이름이 isa_row_name인 행(지금 4행)의 보유 주식 수·평균단가(원). 현재가는 isa_ticker 종가(원화).
holdings:
  tab: "QQQM 모으기"
  data_row: 3
  headers: {qty: "보유 주식 수", avg_price: ["평균단가($/원)", "평균단가($)"], avg_fx: "평균 환율(원/$)", realized_krw: "올해 실현 이익(원)"}
  isa_row_name: "TIGER 미국나스닥100 (ISA·원화)"
  isa_ticker: "133690.KS"

# ── ISA 비과세 한도 (2026-10-23, 아침 편지 「내 돈」 ISA 줄) ─────────────────────────────
# 비과세 남은 금액 = max(0, 한도 − ISA 손익). isa_type은 아래 표의 이름 중 하나.
isa_type: 서민형
isa_tax_free_krw: {서민형: 4000000, 일반형: 2000000}

# ── 손절 예약 알림 (P3.5) ────────────────────────────────────────────────
alerts:
  stop_near_pct: 3 # 종가가 손절가보다 이 비율(%) 이내로 위에 있으면 "손절 근접" 표시

# ── 주문 안내 문구 (P3.5) ────────────────────────────────────────────────
orders:
  stop_fallback_type: 시장가 # 손절 예약이 미체결일 때 다음 거래일 안내 문구에 쓸 주문 방식

# ── 보고서·브리핑 이름 (2026-10-15 "철수의 아침 편지", 2026-10-16 "오빠의 아침 편지"로 변경) ─────────────────
# 보고서 맨 위 한 줄·HTML title·텔레그램 첨부 설명 첫 줄("오빠의 아침 편지 · 10/14(수)")·첨부 파일 이름에 쓴다
# (notify.briefing.report_titles). 이모지는 쓰지 않는다. 개인 채팅과 단체방에 같은 보고서·같은 설명을 보낸다.
report:
  title: "오빠의 아침 편지" # 보고서 맨 위·HTML title·첨부 설명 첫 줄
  subtitle: "미국 대형주 · 미국 종가 기준 · 규칙 기반 분석" # 맨 아래 「보고서 정보」 접기 안에만
  short_title: "오빠의 아침 편지" # 첨부 파일 이름(오빠의 아침 편지_YYYY-MM-DD.html)
  # 짧은 판(2026-10-17): 개인판 = 할 일 → 시장 한눈에 → 실험 중인 전략 → 접기. 아래 둘은 숨긴 화면을 다시 켜는 스위치.
  show_screening: false # true면 오늘 스크리닝 전체(깔때기·추천 종목·제외·대기·매수매도 상세·보유·주문 방법·규칙·점수 설명)를 개인판에 다시 보임
  show_vbooks_fold: false # true면 예전 「가상 장부 현황」 접기를 다시 보임(지금은 실험 중인 전략 칸 안 표로 같은 내용)
  show_stock_folds: false # 2026-10-22 새 출발: 이번 주 강한 종목·돈이 몰리는 종목 접기(종목 관련) 숨김. true면 다시 보임
  monthly_scorecard: false # 2026-10-22 새 출발: 가상 장부 월간 성적표(시트 쓰기) 끔

# ── 자금 흐름 관찰 (F2, docs/design/flow_watch.md) ──────────────────────────
# 표시·주간 기록 전용(참고용, 매수 신호 아님). 여기 값은 신호·필터·수량 계산에 쓰지 않는다.
# 사전 등록(configs/f2_preregistration.yaml)과 같은 값 — 검증 기간(2026-10 ~ 2027-10)에는 바꾸지 않는다.
flow_watch:
  share_ratio_min: 1.5 # 점유율 배율 기준(이상)
  up_volume_ratio_min: 0.5 # 유입: 상승일 거래량 비중 초과
  recent_days: 5 # 최근 구간(거래일)
  base_days: 60 # 직전 비교 구간(거래일)
  top_n: 10 # TOP 표·주간 목록 크기
  exclude_tickers: [QQQ, QQQM, TQQQ, QLD, SQQQ, PSQ] # 대상에서 뺄 ETF

# ── 이번 주 QQQ보다 강한 종목·업종 (작업 5-1, core/weekly_rs.py, docs/design/weekly_rs.md) ──
# 관찰용 표시 전용 — 신호·필터·수량 계산에 쓰지 않는다. 묶음은 사용자 지정(2026-10-15), 명단에 있는 종목만 쓴다.
weekly_rs:
  days: 5 # 최근 거래일 수 (QQQ 거래일 기준)
  top_n: 10 # 표 1 상위 종목 수
  group_top: 3 # 표 2 상위 묶음 수
  group_bottom: 3 # 표 2 하위 묶음 수
