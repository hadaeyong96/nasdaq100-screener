virtual_books:
  enabled: false # 2026-10-22 새 출발: 1~10번·그림자·동전주 알림·장부 시트 쓰기 모두 끔(코드·설정은 보관, DB는 archive/ 사본 + 드라이브 원본)
  start_date: "2026-10-14" # 다섯 장부 공통 시작일(그날 종가 체결) — 2026-10-15 사용자 결정으로 고정.
  # null이면 첫 실행 기준일을 data/virtual_books.db에 저장해 쓴다(DB가 사라지면 시작일이 바뀌므로 고정해 둔다).
  start_krw: 100000000 # 장부당 가상 1억 원 — 시작일 원/달러 종가로 달러 환산, 이후 달러 운용
  start_fx: 1340.31005859375 # 2026-10-14 원/달러 종가(KRW=X, 전략요약 탭 값) — 2026-10-16 사용자 결정으로 고정. null이면 시작일 종가를 다시 받는다
  signal_ticker: QQQ # 국면 신호: t일 종가 > 200일 단순이동평균 → t+1 거래일 종가 체결 (sealed-a B1과 같은 방식)
  sma_days: 200
  defensive_ticker: SGOV # 200일선 아래일 때 전환 장부가 들고 있는 종목
  commission_pct: 0.07 # 편도 수수료(%)
  slippage_pct: 0.0 # 편도 슬리피지(%) — 운용보수는 ETF 가격에 이미 반영돼 따로 빼지 않는다
  capital_gains_rate_pct: 22 # 연말 실현 순이익 × 22% (공제·이월결손 무시)를 장부 현금에서 실제로 뺀다 — sealed-a와 같음.
  # 현금이 모자라면 보유 종목을 팔아 내고, 그 매도 손익은 다음 해 장부
  dividend_withholding_pct: 15 # [가정] 분배금은 원천징수 15% 뒤 현금으로 쌓는다(재투자 안 함) — 사용자 확인 필요
  min_days_for_annualized: 60 # 연환산 수익률은 시작 후 이 달력일 수 이상일 때만 표시(짧으면 숫자가 과장됨)
  benchmark_book: "QQQ 그냥 보유"
  drawdown_alert_book: "TQQQ 그냥 보유"
  drawdown_alert_pct: -50 # 이 장부 낙폭이 처음 이 값 이하가 되는 날 한 번 알림
  sheet_id_env: VIRTUAL_BOOKS_SHEETS_ID # 쓸 구글 시트 ID 환경변수(없으면 시트 기록만 건너뛰고 경고)
  # 보여 주는 이름(2026-10-17) — 아침 편지·시트 4개 탭에만. 장부 id(name)·DB·계산은 그대로. 시트 복구는 이 표로 되돌려 읽는다.
  display_names:
    "QQQ 그냥 보유": "QQQ 전략"
    "QLD 그냥 보유": "QLD 전략"
    "TQQQ 그냥 보유": "TQQQ 전략"
    "QLD 200일선 전환": "QLD 추세 전략"
    "TQQQ 200일선 전환": "TQQQ 추세 전략"
    "추천 종목 따라하기": "기술지표 전략"
    "볼린저·RSI·MACD 따라하기": "볼린저 전략"
    "6개월 강세 따라하기": "6개월 강세 전략"
    "가치평가 따라하기": "가치평가 전략"
    "한 달 가속 따라하기": "QQQ 대비 1개월 강세 전략" # 2026-10-21 이름 변경(전 "한 달 가속 전략") — id·DB는 그대로
    "동전주 거래량 수렴 따라하기": "동전주 거래량 수렴 전략" # 10번 (2026-10-21)
    "무작위 동전주 20": "무작위 동전주 20(비교용)" # 10번 판정 비교용 그림자
  # 예전 보여 주는 이름 → 장부 id (시트 복구가 이름을 바꾸기 전 시트도 읽게, 2026-10-21)
  display_aliases:
    "한 달 가속 전략": "한 달 가속 따라하기"
  books:
    - {name: "QQQ 그냥 보유", kind: hold, asset: QQQ}
    - {name: "QLD 그냥 보유", kind: hold, asset: QLD}
    - {name: "TQQQ 그냥 보유", kind: hold, asset: TQQQ}
    - {name: "QLD 200일선 전환", kind: sma_switch, asset: QLD}
    - {name: "TQQQ 200일선 전환", kind: sma_switch, asset: TQQQ}
  # ── 추천 따라하기 장부 2개 (core/picks_book.py, 사용자 확정 2026-10-14) ─────────────────────
  # 위 5개 장부와 같은 DB·시트 탭에 6·7번째로 들어간다. 시작일은 병합 뒤 첫 실제 실행일이라 위 5개와 따로 둔다.
  picks:
    enabled: true
    start_date: "2026-10-16" # 두 장부 공통 시작일 — 2026-10-17 사용자 결정으로 고정(시트 전략요약 "config 고정값(picks)"과 같음).
    # null이면 첫 실행 기준일을 DB에 저장해 쓴다
    start_fx: 1340.949951171875 # 시작일 원/달러 종가(시트 "config 고정값(picks)") — 2026-10-17 고정. null이면 시작일 종가를 다시 받는다
    slots: 10 # 최대 보유 종목 수, 한 종목 = 그날 총자산 ÷ slots
    progress_on_skipped_adds: true # [해석, 사용자 확인 필요] A2·A3는 사지 않아도 신호 상태는 원래 전략처럼 다음 단계로 넘어간다
    books:
      - {name: "추천 종목 따라하기", rules: ichimoku} # 지금 브리핑과 같은 신호(core/signals.py)
      - {name: "볼린저·RSI·MACD 따라하기", rules: bollinger} # 일목 자리만 볼린저로 (core/bollinger_signals.py), 브리핑에 섞지 않음
    bollinger:
      period: 20
      std_mult: 2
      ddof: 0 # [가정] 표준편차를 모집단 기준으로(트레이딩뷰 볼린저 밴드와 같게)
      slope_days: 5 # 중심선 상승·하락 = 오늘 중심선 vs 5거래일 전
      touch_days: 5 # A1: 최근 5거래일(오늘 포함) 안에 종가 < 하단
      width_rank_period: 120 # 밴드폭 백분위 기간
      width_rank_max: 0.2 # 하위 20%
      squeeze_bonus: 20 # [가정] 수축 후 확장 가점 (구름 두께 항목 최대 점수와 같게)
  # ── 8번 장부 「6개월 강세 따라하기」 (core/momentum_book.py, 작업 5-2 사전 등록 2026-10-15 — 임의 변경 금지) ──
  # 매월 마지막 거래일 종가 신호 → 다음 거래일 종가 체결. 점수 = 126거래일 수익률 − QQQ 같은 기간 수익률.
  # 상위 10을 같은 비중(총자산 ÷ 10)으로 매달 다시 맞춘다(남은 종목은 비중 차이만). SGOV 없음(쉬는 돈 없음).
  # 명단 이탈 보유 종목은 다음 교체일에 판다. 비용·세금·환율은 위 장부들과 같다.
  # 2026-10-18 사용자 결정: 8번 자리를 「가치평가 따라하기」로 교체 — 6개월 강세는 시작 기록 없이 탈락 보관(10/30 시작 고정 계획 취소).
  # 코드·DB의 대기 상태는 지우지 않고 끈다(enabled: false).
  momentum:
    enabled: false
    name: "6개월 강세 따라하기"
    start_date: null # null이면 장부가 처음 돈 기준일 이후 첫 월말 신호일이 시작일(DB에 저장). 시작 뒤 시트 "config 고정값(momentum)"대로 고정
    start_fx: null # null이면 시작일(첫 월말 신호일) 원/달러 종가. 시작 뒤 위와 함께 고정
    top_n: 10
    lookback_days: 126
    min_price: 5.0 # 신호일 종가 5달러 이상만 대상
  # ── 8번 장부 「가치평가 따라하기」 (core/value_book.py, docs/prereg/value_score.md 규칙 — 사용자 승인 2026-10-18, 임의 변경 금지) ──
  # 대상: 그 월말 S&P 500 ∪ 나스닥 100 (2026-10-18 23:12 사용자 결정 — 앞으로 기록은 구역 제한 없음; 검증 ③ 판정 장부는 S&P 500 − (나스닥100 ∪ S&P 100)),
  # SIC 6000~6799·5달러 미만·연간 재무 3년 미만·최근 3년 적자 제외 (data/value_live.py).
  # 점수: 재무 70점판(core/value_score.py, 매달 마지막 거래일 재계산). 표시만 100점 만점(× 100/70).
  # 시작일 종가에 1억 원 일시금(매달 납입 없음) → 그 전 월말 점수 49점(표시 70) 이상 상위 10, 업종(SIC 2자리) 최대 3.
  # 유지 35점(표시 50) — 분기 말 2번 연속 미만이면 다음 거래일 매도(보유 1년 미만은 안 함). 빈자리는 현금 → 12월 실행일에 채움.
  # 12월 실행일(그해 마지막 거래일 2거래일 전 = core.tax_harvest.deadline, 2026년은 12/29): 11월 말 점수로 갈아타기 1건
  # (56점(표시 80) 이상·10점(표시 약 14.3) 차, 수량 = 남은 공제 ÷ 1주당 이익, 최대 절반) → 빈자리 → 남은 공제로 공제 소진.
  # 세금은 공용 규칙(연 원화 실현 순이익 − 250만 원 → 22%, 다음 해 5월 첫 거래일 납부). 다른 가상 장부(달러·연말)와 다르다.
  value_score:
    enabled: true
    name: "가치평가 따라하기"
    start_date: "2026-10-19" # 배포(2026-10-18) 다음 NYSE 거래일 — 2026-10-18 사용자 결정으로 고정
    start_fx: null # 시작일 원/달러 종가. 시작 뒤 시트 "config 고정값(value_score)"대로 고정(고정 뒤 DB가 없으면 새로 시작하지 않음)
    slots: 10
    min_pick: 49 # 70점판(표시 70)
    min_keep: 35 # 70점판(표시 50)
    min_swap: 56 # 70점판(표시 80)
    swap_gap: 10 # 70점판(표시 약 14.3)
    sector_cap: 3
    commission_pct: 0.07 # 사전 등록 비용 (편도)
    slippage_pct: 0.1
    fx_spread_pct: 0.1
    tax_rate_pct: 22
    deduction_krw: 2500000
  # ── 9번 장부 「한 달 가속 따라하기」 (core/accel.py + core/momentum_book.py, 작업 6-2 사전 등록 2026-10-15 — 임의 변경 금지) ──
  # RS선 = 종가 ÷ QQQ, 점수 = RS(t)/RS(t−20) − RS(t−20)/RS(t−40). 60거래일 이상·종가 5달러 이상, 상위 10 같은 비중.
  # 처음 돈 기준일이 첫 신호일, 그 뒤 20거래일(NYSE 달력)마다 교체 → 다음 거래일 종가 체결. 그 밖은 6개월 강세 장부와 같다.
