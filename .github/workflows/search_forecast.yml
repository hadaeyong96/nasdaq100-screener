name: Search forecast (weekly)

# 검색량 실적 예고 — 주 1회 수집·점수 잠금·시즌 예측 잠금·채점 (docs/prereg/search_forecast.md, engine/search_forecast.py).
# 일요일 KST 10:30 = UTC 일요일 01:30. 아침 편지(daily.yml, 매일 KST 07:37~09:07 예약)와 시간이 겹치지 않게 둔다.
# concurrency: v1.1(2026-11-02)부터 daily-screener 그룹(편지·시장 온도계와 같은 그룹)에 들어간다 — 셋 다 같은 가상 장부 DB(드라이브)를
# 받고 올리므로 동시에 돌면 서로의 기록을 덮어쓴다. cancel-in-progress: false라 앞 실행이 끝날 때까지 기다리기만 한다(취소 없음).
# 편지와 실행은 따로라 이 실행이 실패해도 편지 발송에는 영향 없음 — 개인방에 "검색량 예고 실패" 한 줄만.
# 다만 같은 그룹이라 이 실행이 도는 동안(요청 38개 × 40초 ≈ 25분, 최대 90분) 편지 예약 실행은 기다린다(일요일 오전, 편지 없는 날).
# GitHub 규칙: 그룹마다 대기 실행은 하나만 — 새로 들어온 대기가 앞 대기를 취소한다(편지 예약끼리는 원래 그랬다).
# 잠금 파일(시각·해시만)은 main에 커밋·push.
on:
  schedule:
    - cron: "30 1 * * 0"
  workflow_dispatch: {}

concurrency:
  group: daily-screener
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  search-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 가상 장부 DB를 받는다. 실패하면 실행하지 않고 올리지도 않는다(장부 DB 보호).
      - name: Download virtual books state from Google Drive
        id: download
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS }}
        run: python scripts/drive_sync.py download --mode vbooks

      - name: Run search forecast
        id: run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m engine.search_forecast

      # 받기에 성공했을 때만 올린다 — 못 받은 채(빈 DB) 올려 가상 장부 기록을 지우는 일이 없게.
      - name: Upload virtual books state to Google Drive
        if: always() && steps.download.outcome == 'success'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS }}
        run: python scripts/drive_sync.py upload --mode vbooks

      # 잠금 파일(시각·SHA-256만, 종목·방향 없음)을 커밋·push. 새 줄이 없으면 건너뛴다.
      - name: Commit lock files
        if: steps.run.outcome == 'success'
        run: |
          git config user.name "search-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          # 잠글 분기가 없던 주는 폴더가 안 생긴다 — git add가 pathspec 오류(exit 128)로 실패하지 않게 건너뛴다(2026-11-08 실패).
          if [ ! -d docs/forecast_locks ]; then echo "새 잠금 없음(폴더 없음)"; exit 0; fi
          git add docs/forecast_locks
          if git diff --cached --quiet; then echo "새 잠금 없음"; exit 0; fi
          git commit -m "검색량 예고 잠금: $(date -u +%Y-%m-%dT%H:%MZ) (시각·해시만)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_ops_alert.py "검색량 예고 실패"
