name: Daily screener

# 매일 한국시간(KST) 06:47 = UTC 21:47 (한국은 서머타임이 없어 cron이 항상 고정).
# 미국장 마감은 서머타임 기간 KST 05:00, 11월~3월(EST) KST 06:00 — 겨울에도 마감 후
# 47분 여유를 둬 확정 봉을 받는다. 정각(:00)은 GitHub 예약 실행이 몰려 지연되기 쉬워
# 피한다 (2026-09-30 UTC 22:00 예약이 약 3시간 늦게 돌았다).
on:
  schedule:
    - cron: "47 21 * * *"
  workflow_dispatch: {}

# 예약 실행과 수동 실행이 겹치면 드라이브 state DB를 서로 덮어쓴다 -> 한 번에 하나만.
# 진행 중인 실행은 취소하지 않고 끝날 때까지 기다린다.
concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 러너는 실행마다 새 가상머신이라 로컬 DB가 안 남는다 -> 실행 전 드라이브에서
      # 내려받는다. 해당 GOOGLE_DRIVE_STATE_FILE_ID_* 시크릿이 없으면(설정 전)
      # scripts/drive_sync.py가 조용히 건너뛴다 - 그러면 매 실행이 빈 DB로 시작한다.
      - name: Download state from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_STATE_FILE_ID_LIVE: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_LIVE }}
          GOOGLE_DRIVE_STATE_FILE_ID_PAPER: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_PAPER }}
        run: |
          python scripts/drive_sync.py download --mode live
          python scripts/drive_sync.py download --mode paper

      # 가상 장부 DB(docs/design/virtual_books.md)는 따로 받는다 — 실패해도 브리핑은 그대로 진행.
      - name: Download virtual books state from Google Drive
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS }}
        run: python scripts/drive_sync.py download --mode vbooks

      - name: Run engine.daily (live, then paper)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 단체방(투자클럽) 공개 발송용 — 비어 있으면(Secret 미설정) 단체방 발송만
          # 건너뛰고 나머지는 그대로 진행한다 (notify/telegram.py send_group_briefing).
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          # 전략공장 알림(전략분석기 텔레그램 전용, factory/notify.py) — 비어 있으면 알림만 건너뛴다.
          # 봇 토큰은 TELEGRAM_FACTORY_BOT_TOKEN, 없으면 TELEGRAM_BOT_TOKEN을 쓴다
          TELEGRAM_FACTORY_CHAT_ID: ${{ secrets.TELEGRAM_FACTORY_CHAT_ID }}
          TELEGRAM_FACTORY_BOT_TOKEN: ${{ secrets.TELEGRAM_FACTORY_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 가상 장부 시트(먼저 사본 시트) — 없으면 시트 기록만 건너뛴다
          VIRTUAL_BOOKS_SHEETS_ID: ${{ secrets.VIRTUAL_BOOKS_SHEETS_ID }}
          # 값은 쓰지 않고 있는지만 본다: 없고 시작일도 미고정이면 가상 장부가 매일 새로 시작하므로 멈춘다
          GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS }}
        run: |
          python -m engine.daily --mode live
          python -m engine.daily --mode paper --no-send

      # 위 스텝이 실패해도(부분 진행) 되돌릴 수 있는 상태는 그대로 올려 둔다.
      - name: Upload state to Google Drive
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_STATE_FILE_ID_LIVE: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_LIVE }}
          GOOGLE_DRIVE_STATE_FILE_ID_PAPER: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_PAPER }}
        run: |
          python scripts/drive_sync.py upload --mode live
          python scripts/drive_sync.py upload --mode paper

      - name: Upload virtual books state to Google Drive
        if: always()
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS }}
        run: python scripts/drive_sync.py upload --mode vbooks

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          python scripts/send_ops_alert.py
          "Nasdaq100 screener GitHub Actions daily run FAILED. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
