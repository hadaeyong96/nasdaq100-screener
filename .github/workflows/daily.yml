name: Daily screener

# 매일 한국시간(KST) 08:07 = UTC 23:07 (한국은 서머타임이 없어 cron이 항상 고정).
# 2026-10-21 06:47 → 08:07: 06:47(미국 서머타임 기간 마감 1시간 47분 뒤) 실행은 그날 종가를 아직 못 받아
# 기준일이 하루 늦었다(10/21 06:47 실행 기준일 10/19, 마감 거래일은 10/20). 미국장 마감은 서머타임 기간 KST 05:00,
# 11월~3월(EST) KST 06:00 — 08:07이면 여름 3시간 7분, 겨울 2시간 7분 여유. 날짜 계산은 그대로:
# 편지·월간 성적표는 한국 날짜(06:47과 같은 날), 12월 공제 안내는 미국 기준일, 확정 봉 판정은 미국 동부 시각(같은 미국 날 저녁).
# 정각(:00)은 GitHub 예약 실행이 몰려 지연되기 쉬워 피한다 (2026-09-30 UTC 22:00 예약이 약 3시간 늦게 돌았다).
# 2026-10-27 예약 4개: 23:07 하나는 실제로 1시간 55분~2시간 53분 늦게 돌았다(10/21~10/27) — 도착 시각이 들쭉날쭉.
# KST 07:37·08:07·08:37·09:07(UTC 22:37·23:07·23:37·00:07) 중 먼저 새 종가를 받은 실행이 편지를 보내고,
# 나머지는 기준일당 1회 규칙(state DB last_processed_date + 발송 기록, 월요일 주간 편지는 하루 한 번 더)으로 아무것도 안 한다.
# 데이터 지연 알림은 마지막 예약(config.yaml run_schedule.final_cron)·수동 실행에서만 보낸다.
on:
  schedule:
    - cron: "37 22 * * *"
    - cron: "7 23 * * *"
    - cron: "37 23 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch: {}

# 예약 실행끼리·수동 실행과 겹치면 드라이브 state DB를 서로 덮어쓴다 -> 한 번에 하나만(그룹 하나).
# 진행 중인 실행은 취소하지 않고 끝날 때까지 기다린다 — 다음 실행은 앞 실행이 올린 DB를 받아 중복 발송을 막는다.
concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 2026-10-18 30→60: 8번 가치평가 장부가 월말에 EDGAR 재무 약 350종목을 받는다
    # 10번 동전주 장부는 분기 선정일(1·4·7·10월 첫 거래일)에만 목록 약 5,600종목 가격을 받는다(로컬 약 5분 30초)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 수익곡선 그래프(notify/curve_chart.py)의 한글 글꼴 — 우분투 무료 패키지 나눔글꼴. 실패해도 진행(그래프만 글씨가 깨짐).
      - name: Install Korean font
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          rm -rf ~/.cache/matplotlib

      # 러너는 실행마다 새 가상머신이라 로컬 DB가 안 남는다 -> 실행 전 드라이브에서
      # 내려받는다. 해당 GOOGLE_DRIVE_STATE_FILE_ID_* 시크릿이 없으면(설정 전)
      # scripts/drive_sync.py가 조용히 건너뛴다 - 그러면 매 실행이 빈 DB로 시작한다.
      - name: Download state from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_STATE_FILE_ID_LIVE: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_LIVE }}
          GOOGLE_DRIVE_STATE_FILE_ID_PAPER: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_PAPER }}
        run: |
          python scripts/drive_sync.py download --mode live
          python scripts/drive_sync.py download --mode paper

      # 가상 장부 DB(docs/design/virtual_books.md)는 따로 받는다 — 실패해도 브리핑은 그대로 진행.
      - name: Download virtual books state from Google Drive
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS }}
        run: python scripts/drive_sync.py download --mode vbooks

      - name: Run engine.daily (live, then paper)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 단체방(투자클럽) 공개 발송용 — 비어 있으면(Secret 미설정) 단체방 발송만
          # 건너뛰고 나머지는 그대로 진행한다 (notify/telegram.py send_group_briefing).
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          # 전략공장 알림(전략분석기 텔레그램 전용, factory/notify.py) — 비어 있으면 알림만 건너뛴다.
          # 봇 토큰은 TELEGRAM_FACTORY_BOT_TOKEN, 없으면 TELEGRAM_BOT_TOKEN을 쓴다
          TELEGRAM_FACTORY_CHAT_ID: ${{ secrets.TELEGRAM_FACTORY_CHAT_ID }}
          TELEGRAM_FACTORY_BOT_TOKEN: ${{ secrets.TELEGRAM_FACTORY_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 2026-10-22 새 출발: 가상 장부 기록 시트는 보관용 — 더 이상 넘기지 않는다(가상 장부·시트 쓰기 끔).
          # GOOGLE_SHEETS_ID(사용자 시트)는 「QQQM 모으기」 읽기 전용.
          # 값은 쓰지 않고 있는지만 본다: 없고 시작일도 미고정이면 가상 장부가 매일 새로 시작하므로 멈춘다
          GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS }}
          # 8번 가치평가 장부의 EDGAR 요청 User-Agent(연락처) — 없으면 8번만 오류로 기다리고 나머지는 그대로
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # 어느 예약이 돌았는지(수동 실행은 빈 값) — 마지막 예약 전에는 데이터 지연 알림을 미룬다(engine/daily._delay_notice_held)
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python -m engine.daily --mode live
          python -m engine.daily --mode paper --no-send

      # 위 스텝이 실패해도(부분 진행) 되돌릴 수 있는 상태는 그대로 올려 둔다.
      - name: Upload state to Google Drive
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_STATE_FILE_ID_LIVE: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_LIVE }}
          GOOGLE_DRIVE_STATE_FILE_ID_PAPER: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_PAPER }}
        run: |
          python scripts/drive_sync.py upload --mode live
          python scripts/drive_sync.py upload --mode paper

      - name: Upload virtual books state to Google Drive
        if: always()
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS: ${{ secrets.GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS }}
        run: python scripts/drive_sync.py upload --mode vbooks

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          python scripts/send_ops_alert.py
          "Nasdaq100 screener GitHub Actions daily run FAILED. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
