# 시장 온도계 (0~100도) 설정 — thermometer/ (2026-10-28). 모든 기준값·구간·예약을 여기서 고친다.
# 시장 상태를 보는 온도계일 뿐 매매 신호가 아니다. 가상 장부(puddle_v32·puddle_rebound_v2)에는 연결하지 않는다.

item_max: 20 # 항목 하나의 최고 도수 (5개 × 20 = 100도)

# ① 150일선(빠른 신호) ② 200일선(확인 신호): QQQ 종가의 이격률 x% → item_max × clip((x − low) / (high − low), 0, 1) — ±15%면 20 × clip((x + 15) / 30, 0, 1)
sma:
  ticker: QQQ
  fast_days: 150
  slow_days: 200
  gap_low_pct: -15.0 # 이하면 0도 (2026-10-28 ±10% → ±15%)
  gap_high_pct: 15.0 # 이상이면 20도

# ③ 시장 폭: 그날 나스닥100 구성 종목 중 종가 > 자기 SMA50 비율 p% → p ÷ 5
breadth:
  sma_days: 50
  min_coverage: 0.8 # 구성 종목 중 SMA50을 계산할 수 있는 종목이 이 비율 미만이면 "자료 없음"
  recovery_lookback: 10 # 직전 10거래일 안에
  recovery_low_pct: 20.0 # 20% 미만이었다가
  recovery_high_pct: 50.0 # 50% 이상이 되면 "강한 회복"

# ④ VIX v → item_max × clip((high − v) / (high − low), 0, 1)
vix:
  ticker: ^VIX
  high: 35.0 # 이상이면 0도
  low: 12.0 # 이하면 20도
  peak_lookback: 21 # 직전 21거래일(오늘 제외) 최고가(장중 고가)가
  peak_mark: 25.0 # 이 값 이상이면 "(지난달 {최고}에서 하락)" 덧붙임

# ⑤ 공포·탐욕 f → f ÷ 5 (아침 편지와 같은 data.macro.get_fear_greed 값)
fear_greed:
  stale_days: 3 # 기준일보다 3일 넘게 오래된 값이면 "자료 없음"
  labels: # f가 max 이하인 첫 구간 이름
    - {max: 44, label: 공포}
    - {max: 55, label: 중립}
    - {max: 100, label: 탐욕}

# 구간: 합계 온도(정수)가 max 이하인 첫 구간
zones:
  - {max: 20, name: 얼음, desc: 극심한 공포·약세}
  - {max: 40, name: 차가움, desc: 약세}
  - {max: 60, name: 미지근함, desc: 회복 진행}
  - {max: 80, name: 따뜻함, desc: 건강한 상승}
  - {max: 100, name: 뜨거움, desc: 과열 주의}

# 해석 한 줄 (150일선·200일선 위/아래). 네 문구 모두 확정(2026-10-28).
interpretation:
  both_above: 장기 흐름 회복
  fast_above_slow_below: 회복 초기(빠른 신호만 켜짐)
  both_below: 장기 흐름 약세
  fast_below_slow_above: 단기 흐름 약해짐(200일선은 위)

# 이름 (메시지·자료 없음 줄)
names:
  sma_fast: 150일선
  sma_slow: 200일선
  breadth: 시장 폭
  vix: 공포 지수 VIX
  fear_greed: 공포·탐욕

# 독립 텔레그램 메시지 (2026-10-29 중단): 온도는 아침 편지 보고서 「시장 온도」 칸에 들어가고, 기록(thermometer_history)은
# 아침 편지 실행(engine.daily)이 남긴다. true로 바꾸고 thermometer.yml에 예약(schedule.crons)을 다시 넣으면 예전처럼 따로 보낸다.
telegram:
  enabled: false

# 예약 — 지금은 꺼져 있다(thermometer.yml은 수동 실행만). 다시 켤 때 thermometer.yml의 cron을 이 값과 같게 넣는다.
schedule:
  crons: ["50 22 * * *", "50 23 * * *"] # KST 07:50 · 08:50
  final_cron: "50 23 * * *" # 마지막 예약: 여기서도 자료가 안 되면 실패로 본다
  skip_weekdays_kst: [6, 0] # 일(6)·월(0) — 새 미국 종가 없음 (파이썬 weekday 번호)

# 기록: 가상 장부 DB(드라이브 동기화 중)의 thermometer_history 표 — 2026-10-29부터 아침 편지 실행이 기준일마다 한 줄
# (독립 메시지를 다시 켜면 중복 발송 막기도 이 표)
history:
  path: data/virtual_books.db
  drive_env: GOOGLE_DRIVE_STATE_FILE_ID_VBOOKS # Actions에서 이 시크릿이 없으면 기록을 못 남기므로 보내지 않는다
  backfill_path: data/thermometer/history_backfill.csv
  backfill_start: "1999-01-01"
  backfill_end: "2021-12-31" # 2022-01-01 이후 과거 시계열은 계산 금지(봉인)

footer: ※ 시장 상태를 보는 온도계입니다. 매매 신호가 아닙니다.

# 「공포 매수판」 (2026-10-31) — thermometer/fear_board.py. 조건 5개 중 켜진 수(count)로 구간을 나눈다. 보고서 「시장 온도」 칸 아래 표.
# 정보용 안내판이다. 가상 장부에는 연결하지 않는다.
fear_board:
  fear_greed_max: 25 # ① 공포·탐욕 ≤ 25 (온도계 ⑤와 같은 값·같은 stale_days)
  rsi_days: 14 # ② QQQ RSI(14, Wilder) ≤ rsi_max
  rsi_max: 30
  bollinger: {period: 20, std_mult: 2, ddof: 0} # ③ QQQ 종가 < 볼린저 하단(20일, 2σ, 모집단 표준편차 — 트레이딩뷰와 같게)
  sma_long: 60 # ④ QQQ 종가 ≤ SMA60 그리고
  sma_short: 20 #    SMA20 < sma_lag거래일 전 SMA20
  sma_lag: 21
  vix_min: 30 # ⑤ VIX 종가 ≥ 30
  zones: # count가 max 이하인 첫 구간
    - {max: 1, name: 평소, line: 적립만 그대로입니다.}
    - {max: 2, name: 눌림, line: 눌림 구간입니다. 저축일에 그대로 삽니다.}
    - {max: 5, name: 공포, line: 공포 구간입니다. 여윳돈이 있으면 추가 매수해도 좋은 구간입니다. 가진 주식은 팔지 않습니다.}
  caption_zone: 공포 # 이 구간이면 텔레그램 설명 한 줄 끝에 " · 공포 매수판 {n}/5" (letter_phrases.yaml caption.fear_board)
  names:
    fear_greed: 공포·탐욕 ≤ 25
    rsi: QQQ RSI(14) ≤ 30
    bollinger: QQQ 종가 < 볼린저 하단(20일, 2σ)
    trend: QQQ 종가 ≤ 60일선 · 20일선 하락(21거래일 전보다 낮음)
    vix: VIX ≥ 30
  # 참고 통계(docs/fear_board_notes.md, scripts/fear_board_notes.py) — 정보용, 판정 아님. 2022-01-01 이후 계산 금지(봉인 ⓑ)
  notes:
    start: "1999-01-01"
    end: "2021-12-31"
    horizons: [63, 126, 252] # 다음 n거래일 수익
    episode_gap_days: 21 # 공포 구간 묶음: 앞 공포일과 이 거래일 수 이내로 떨어진 날은 같은 하락으로 본다
