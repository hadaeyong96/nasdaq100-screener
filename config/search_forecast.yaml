revenue_tags: # EDGAR XBRL 매출 태그(앞에서부터 먼저 있는 것)
  - RevenueFromContractWithCustomerExcludingAssessedTax
  - Revenues
  - RevenueFromContractWithCustomerIncludingAssessedTax
  - SalesRevenueNet
  - SalesRevenueGoodsNet

grading:
  windows: {"-1~+1일": [-1, 1], "1개월": [-1, 21], "6개월": [-1, 126]} # 발표일 기준 거래일 위치(앞 = 시작 종가, 뒤 = 끝 종가)
  benchmark: QQQ
