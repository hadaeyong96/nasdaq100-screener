# 아침 편지 문구 (2026-10-24, 아침 편지 v3) — 사용자가 고쳐도 된다. 경어체("…니다.")로 쓴다.
# 2026-10-29: 텔레그램은 보고서 파일 하나 + 설명 한 줄(caption)만. 안 쓰는 문구는 지우지 않고 주석으로 남겼다(앞에 "# ").
# {값}은 코드가 채운다. 같은 상황에 문장을 여럿 적으면(목록) 날짜에 따라 돌려 쓴다(전날과 다른 문장).
# 종목 이름 뒤 조사({종목}을/를, 이/가, 은/는)는 코드가 읽는 소리에 맞춰 고친다(AMD를, AAPL을, AMZN이).
# 숫자는 소수 첫째 자리, 금액은 만 원 단위.

title: "[오빠의 아침 편지] {날짜}"

headers:
  top: ■ 오늘의 핵심
  market: ■ 지수·금리·환율
  todo: ■ 오늘 할 일
  money: ■ 내 돈
  candidates: ■ 웅덩이 후보 (가상 실험 신호, 실제 매수 권유 아님)
  lab: ■ 가상 실험 (실제 돈 아님)

# [안 씀 2026-10-29 — 시장 온도 칸이 대신함] 오늘의 한 줄 — ■ 미국 증시 마감 칸 첫 줄. 위에서부터 먼저 맞는 것 하나만.
# headline:
#   holiday: 미국 장이 쉬었습니다. 숫자는 지난 거래일 그대로입니다.
#   savings: 오늘은 저축일입니다.
#   dec_tax: 세금 없이 정리할 기회가 {n}일 남았습니다.
#   crash: 시장이 고점보다 {dd}% 무너졌습니다. 팔지 않는 것이 할 일입니다.   # 하루 하락은 지수 줄에만
#   down: 장기 평균선보다 {z}% 아래로 내려왔습니다. 버티는 구간입니다.
#   big_up:
#     - 시장이 {x}% 크게 올랐습니다.
#     - 나스닥이 {x}% 힘차게 올랐습니다.
#   big_down: 시장이 {x}% 크게 빠졌습니다. 큰 흐름은 괜찮습니다.
#   crossroads: 시장이 장기 평균선과 {z}% 차이로 방향을 고르고 있습니다.
#   calm: 시장이 {x}% 움직이며 조용합니다.

# [안 씀 2026-10-29] 오늘의 한 줄 기준(나스닥100 QQQ 하루 변화, 장기 평균선(200일)과의 차이)
# thresholds:
#   big_move_pct: 1.5     # 하루 ±1.5% 이상이면 "크게"
#   crossroads_pct: 2.0   # 장기 평균선과 ±2.0% 안이면 "갈림길"

market:   # ② 시장 온도 칸 아래 「지수·금리·환율」 — 지수 등락은 표로만 보인다
  holiday: 미국 장이 쉬었습니다. 숫자는 지난 거래일 그대로입니다.   # 휴장 다음 날만
#   index: 나스닥100(QQQ) {q}% · S&P500 {s}% · 반도체(SOXX) {c}%   # [안 씀 2026-10-29] 지수 표와 같은 숫자
  rates: 미국 10년 금리 {r}% · 환율 {fx}원
#   regime:   # [안 씀 2026-10-29 — 시장 온도 칸 150일선·200일선이 대신함]
#     up: 장기 평균선보다 {z}% 위입니다. 큰 흐름은 상승입니다.
#     down: 장기 평균선보다 {z}% 아래입니다. 흐름이 약해졌습니다.
#     crash: 짧은 시간에 크게 빠졌습니다. 폭락 구간입니다.
#     crossroads: 장기 평균선과 {z}% 차이입니다. 방향을 정하는 중입니다.
#   mood:   # [안 씀 2026-10-29 — 시장 온도 칸 공포·탐욕이 대신함] 투자 심리(공포·탐욕 지수 0~100) — max 이하인 첫 줄
#     - {max: 24, text: "투자 심리 {v}. 몹시 겁먹은 상태입니다."}
#     - {max: 44, text: "투자 심리 {v}. 조금 겁먹은 분위기입니다."}
#     - {max: 55, text: "투자 심리 {v}. 무덤덤한 분위기입니다."}
#     - {max: 75, text: "투자 심리 {v}. 기대감이 커졌습니다."}
#     - {max: 100, text: "투자 심리 {v}. 너무 들떴습니다. 조심할 때입니다."}
  warn:   # 위험 단계 지표가 있을 때만 — 하루 한 줄로 합친다(아래 순서대로 "A와 B", "A, B와 C")
    line: "{항목}은 조심해서 봅니다."   # 조사(은/는)는 마지막 항목 소리에 맞춘다
    items:
      dgs10: 높은 10년 금리
      fed: 기준금리 인상
      vix: 높은 시장 불안 지수(VIX)
      hy: 회사채 위험 신호(하이일드 스프레드)
      t10y2y: 장단기 금리차

todo:
  none: 투자 포지션 변경 없습니다.
  savings: ISA에서 TIGER 미국나스닥100을 삽니다. 한도를 넘는 돈은 QQQM을 삽니다.
  savings_moved: 원래 저축일은 {날짜}였습니다. ISA는 그날 사도 됩니다.
  crash: 시장이 크게 빠졌습니다. 팔지 않습니다. 적립만 이어갑니다.   # 급락장 경고는 이 칸에만(2026-10-29)
  dec_tax: 세금 없이 팔 수 있는 이익이 {남은}만 원 남았습니다. {마감일}까지 QQQM을 팔고 바로 다시 삽니다.
  dec_tax_loss: QQQM이 지금 손실이라 올해 세금 정리는 필요 없습니다.
  dec_tax_no_room: 올해 세금 없이 팔 수 있는 한도는 이미 다 썼습니다.
  dec_tax_no_record: 올해 세금 정리를 계산하려면 시트에 QQQM 보유를 넣어 주십시오.
  scorecard: "{월}월 가상 성적표가 나왔습니다. 첨부 파일에 있습니다."

money:   # 개인판만
  item: "{이름} {금액}만 원, {률}% {방향}."   # 방향 = 올랐습니다/내렸습니다
  item_flat: "{이름} {금액}만 원, 그대로입니다."
  total: 합계 {합계}만 원입니다.
  room: 세금 없이 팔 수 있는 이익 {남은}만 원, ISA 비과세 한도 {isa남은}만 원 남았습니다.
  room_qqqm: 세금 없이 팔 수 있는 이익 {남은}만 원 남았습니다.
  room_isa: ISA 비과세 한도 {isa남은}만 원 남았습니다.
  no_price: "{이름} 오늘 가격을 받지 못했습니다."
  empty: 시트 노란 칸을 채우면 표시됩니다.

lab:
  line: "{이름}: {내용}"   # 장부마다 한 줄 — 아래 문장들을 이어 붙인다
  names:
    v31: 웅덩이 v3.1   # 보관(2026-10-27)
    rebound: 웅덩이 반등 확인   # 보관(2026-10-27)
    v32: 웅덩이 v3.2
    rebound_v2: 웅덩이 반등 확인 v2
  same: QQQ와 같습니다.
  ahead: QQQ보다 {d}%p 앞섭니다.
  behind: QQQ보다 {d}%p 뒤처집니다.
  none: QQQ만 들고 있습니다.
  hold: "{종목} {w}% 담고 있습니다."
  hold_group: "{n}종목 {w}% 담고 있습니다."   # 단체방판(종목명 없음)
  buy1: "{종목}을 처음 샀습니다."
  buy2: "{종목}을 조금 더 샀습니다."
  sell_high: "{종목} 웅덩이가 메워져 팔았습니다."
  sell_rank: "{종목}이 대형 10종목에서 밀려 팔았습니다."
  sell_max_hold: "{종목}을 1년 가까이 들고 있어 정리했습니다."
  sell_gone: "{종목}은 가격 자료가 끊겨 정리했습니다."
  skip_earnings: "{종목}은 실적 발표 직후라 사지 않았습니다."
  skip_earnings_group: "{n}종목은 실적 발표 직후라 사지 않았습니다."
  filter_compare: 필터 없는 판보다 {e}%p {방향}.   # 월요일만, 방향 = 앞섭니다/뒤처집니다 (비교 자료가 생기면 표시)
  research_result: 「{이름}」 시험 결과는 {판정}입니다.   # 월요일·판정 다음 날만
  research_testing: 「{이름}」을 시험하고 있습니다.   # 월요일만(판정 전)
  in_progress: 웅덩이 v3.2·반등 확인 v2를 12개월 가상 기록 중입니다.   # 월요일·판정 다음 날만
  group_buy: 오늘 가상으로 {n}종목을 샀습니다.
  group_sell: 오늘 가상으로 {n}종목을 팔았습니다.

# ■ 웅덩이 후보 — 웅덩이 반등 확인 장부(가상)의 그날 단계. 개인판은 대형 10종목 중 해당 종목만, 단체방판은 개수만.
candidates:
  buy: "반등 확인 — 오늘 가상 매수: {종목} (RSI {rsi}, MACD 골든크로스)"
  waiting: "반등 확인 대기: {종목} (웅덩이 {n}일째, RSI {rsi})"
  opened: "웅덩이 진입: {종목} (60일선 아래 처음)"
  skipped: "실적 발표 직후라 제외: {종목}"
  unqualified: "자격 미달(200일선 아래 등): {종목}"
  none: 오늘은 웅덩이 후보가 없습니다.
  group: 반등 확인 {a}종목 · 대기 {b}종목 · 진입 {c}종목
  caution: ※ 웅덩이 후보는 12개월 시험 중인 가상 전략의 신호입니다. 검증 전이라 실제 매수 권유가 아닙니다.

# ■ 가상 실험 — 웅덩이 반등 확인 v2 장부 줄(웅덩이 v3.2 줄 아래)은 위 lab 문구를 같이 쓴다(이름 = lab.names.rebound_v2).
rebound:
  vs_v31: 웅덩이 {b}보다 {e}%p {방향}.   # 월요일만, b = 비교 B 장부(v3.2), 방향 = 앞섭니다/뒤처집니다

news:
  line: "{제목} ({언론사})"
  failed: 뉴스를 불러오지 못했습니다.

problem:
  prefix: "자료 문제: "
  lag: 미국 자료가 {n}일 늦었습니다. 오늘 시장과 다를 수 있습니다.
  news_partial: 뉴스 일부를 불러오지 못했습니다.
  earnings_check: 실적 발표 확인을 못 한 종목이 있습니다{상세}.
  puddle_error: 웅덩이 v3.2 장부를 계산하지 못했습니다.
  rebound_error: 웅덩이 반등 확인 v2 장부를 계산하지 못했습니다.
  shares_missing: 주식 수를 못 받아 시가총액 순위에서 뺀 종목이 있습니다{상세}.
  chart_error: 그래프를 만들지 못했습니다.
  fred_missing: 시장 지표 {n}개를 받지 못했습니다.
  input_errors: 시트 입력 오류가 {n}건 있습니다.

footer:
  base: 미국 {날짜} 종가 기준입니다.
  caution: ※ 뉴스는 제목 모음입니다. 매매 신호가 아닙니다.
#   more: 나머지는 첨부 파일에 있습니다.   # [안 씀 2026-10-29] 문자 메시지를 보내지 않음

# 텔레그램 파일 설명 한 줄(2026-10-29): "[오빠의 아침 편지] 10/29(목) · 시장 온도 60도" — 머리줄은 위 title.
# 할 일이 todo.none이 아니면 끝에 " · {todo}", 자료 문제가 있으면 " · {problem}".
caption:
  temp: "시장 온도 {T}도"   # 그 기준일 온도가 없으면 생략
  fear_board: "공포 매수판 {n}/5"   # 공포 매수판이 공포 구간(config/thermometer.yaml fear_board.caption_zone)인 날만, 맨 끝
  todo: 오늘 할 일 있음
  problem: 자료 문제 있음

# ① 오늘 요약(보고서 맨 위, 최대 5줄): 시장 온도·QQQ / 할 일 / 내 돈 합계(개인판) / 가상 실험. 머리표 "▶ "는 코드가 붙인다.
# 할 일은 ④ 오늘 할 일 첫 줄의 첫 문장. 급락장 경고 문장은 ④에만 둔다.
summary:
#   max_lines: 12   # [안 씀 2026-10-29] 요약 쪽지(문자 메시지) 한도
#   max_chars: 700
  temp: "시장 온도 {T}도({구간})"   # 온도가 없으면 생략
  market: "QQQ {q}%"   # 온도 뒤에 " · "로 붙인다
  todo: "할 일: {할일}"
  todo_crash: 오늘 할 일 칸을 꼭 봐 주십시오.   # 급락장 줄만 있는 날
  money: "내 돈: 합계 {합계}만 원, {률}% {방향}."   # 개인판만, 방향 = 올랐습니다/내렸습니다
  money_flat: "내 돈: 합계 {합계}만 원, 그대로입니다."
#   news: "핵심 뉴스: {제목} ({언론사})"   # [안 씀 2026-10-29] 뉴스는 ③ 뉴스 칸에만
  lab: "가상 실험: 웅덩이 v3.2 {비교}"   # 비교 = lab.same/ahead/behind 문장
  lab_buys: "오늘 가상 매수 {n}건"
  lab_sells: "오늘 가상 매도 {n}건"
#   more: "자세한 내용은 첨부 보고서에 있습니다({상세})."   # [안 씀 2026-10-29] 문자 메시지를 보내지 않음
#   more_news: "뉴스 {n}건"
#   more_candidates: "웅덩이 후보 {m}종목"
#   more_chart: 차트

# 보고서 칸 제목(칸 바로가기 목록에도 같은 이름) — 순서는 코드(letter_plain.REPORT_ORDER)
report:
  toc: 바로가기
  summary: ■ 오늘 요약
#   summary_sub: 문자와 같은 내용   # [안 씀 2026-10-29]
  thermometer: ■ 시장 온도
  thermometer_none: 오늘 시장 온도를 구하지 못했습니다.
  market: 지수·금리·환율   # 시장 온도 칸 안 작은 제목
  news: ■ 뉴스
  todo: ■ 오늘 할 일
  money: ■ 내 돈
  candidates: ■ 웅덩이 후보 (가상 실험 신호, 실제 매수 권유 아님)
  lab: ■ 가상 실험 (실제 돈 아님)
