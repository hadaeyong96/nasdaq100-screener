# 아침 편지 뉴스 주제·검색어·가중치 (2026-10-24, 아침 편지 v3) — 사용자가 고쳐도 된다.
# 구글 뉴스 한국어 RSS(무료, news.google.com/rss/search, hl=ko&gl=KR&ceid=KR:ko)에서 최근 24시간 기사만 받는다.
# 편지에는 제목을 그대로 쓴다(요약·해석 없음).
#
# 점수 = 같은 사건 묶음 안 서로 다른 언론사 수 × 주제 가중치 × 최신성(12시간 안 1.0, 24시간 안 0.7)
# ■ 오늘의 핵심 = 「핵심 뉴스」(점수 ≥ core_min_score) 점수 순 최대 core_max개, 핵심 뉴스가 core_min개 미만이면 점수 상위 core_min개.
# 주제 칸 = 오늘의 핵심을 뺀 나머지에서 최대 3씩(비면 칸 생략).
# 검색어 하나에 따로 가중치를 주려면 {q: 검색어, weight: 숫자}로 쓴다.

core_min_score: 3.0   # 핵심 뉴스 기준 점수
core_max: 10          # 오늘의 핵심 최대 개수
core_min: 3           # 오늘의 핵심 최소 개수(빈 날 방지)

topics:
  - name: 국제정세
    weight: 1.0
    queries:
      - 미중 관계
      - {q: 관세, weight: 1.5}
      - 유럽
      - 일본
      - 중국 경제
  - name: 전쟁·지정학
    weight: 1.5
    queries: [전쟁, 휴전, 우크라이나, 중동, 대만 해협]
  - name: 미국 경제·금리
    weight: 1.5
    queries: [연준, 기준금리, 미국 물가, 미국 고용, 국채 금리]

# 허용 언론사: 왼쪽 = 편지에 쓰는 이름, 오른쪽 = 구글 뉴스에 나오는 이름(띄어쓰기 무시하고 똑같아야 통과)
sources:
  연합뉴스: [연합뉴스]
  뉴스1: [뉴스1]
  뉴시스: [뉴시스, NEWSIS]
  한국경제: [한국경제, 한경, 한국경제신문]
  매일경제: [매일경제, 매경]
  서울경제: [서울경제, 서울경제신문]
  머니투데이: [머니투데이]
  이데일리: [이데일리]
  조선일보: [조선일보]
  중앙일보: [중앙일보]
  동아일보: [동아일보, 동아닷컴]
  한겨레: [한겨레, 한겨레신문]
  경향신문: [경향신문]
  KBS: [KBS, KBS 뉴스, KBS뉴스]
  MBC: [MBC, MBC 뉴스, MBC뉴스, iMBC]
  SBS: [SBS, SBS 뉴스, SBS뉴스]
  YTN: [YTN, YTN 뉴스]
  JTBC: [JTBC, JTBC 뉴스, JTBC뉴스]

# 같은 사건 묶기: 제목 핵심어(조사·불용어 뺀 낱말) 겹침이 짧은 쪽 제목 핵심어의 50% 이상이고 2개 이상이면 한 묶음
group_overlap: 0.5
group_min_shared: 2
# 제목에서 핵심어로 치지 않는 말
stopwords: [속보, 종합, 단독, 사진, 영상, 포토, 기자, 뉴스, 오늘, 내일, 어제, 이번, 관련, 대한, 위해, 통해, 이후, 가운데, 대해, 위한, 것, 등, 및, 또, 더, 첫, 전, 후, 중]
