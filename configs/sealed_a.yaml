      - {name: "2024~2026-09", start: "2024-01-02", end: "2026-09-30"}
    sub_restart_usd: 100000
  criteria:   # 모두 충족 = PASS, 하나라도 미달 = FAIL. 반올림 전 값 비교
    - {id: 1, key: excess_posttax_cagr_vs_B0_pp, min: 2.0}
    - {id: 2, key: mdd_minus_B0_mdd_pp, min: -2.0}
