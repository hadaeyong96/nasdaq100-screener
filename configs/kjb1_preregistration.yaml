# KJB-1 사전 등록 — docs/kjb1_instructions.md 0번.
#
# docs/kjb_nasdaq100_plan.md 3장(백테스트 주 설정·주변값)과 4장(비교·판정·표본
# 부족 기준)을 그대로 옮겨 적는다. 어떤 백테스트도 돌리기 전에 커밋한다.
# 결과를 본 뒤에는 이 파일을 수정하지 않는다 — 판정을 바꾸려고 기준·구간·
# 설정을 사후에 건드리지 않는다. 나쁜 결과도 그대로 보고한다.

registered_at: "2026-09-28"
head_commit_at_registration: "4cea98dce553eddb300615c3c37bc270e50abf60"

# ── 신호 근거 (docs/kjb_nasdaq100_plan.md 2장 #3·#4·#5 — core/kjb.py가 구현) ──
# 사전 등록 대상은 아래 3장의 "주 설정" 숫자다. 신호 공식 자체(63일 상대수익,
# "처음" 판정 등)는 docs/kjb1_instructions.md 1번에 이미 정해져 있고 여기서는
# 그 공식에 넣을 기준값만 확정한다.

# ── 3장: 백테스트 주 설정 ────────────────────────────────────────────────
main_settings:
  universe: "시점별 나스닥 100 구성 종목 (P5와 같음, data.universe_history)"
  period: {start: "2016-01-01", end: "2021-12-31"}
  validation_period_sealed: "2022-01-01 이후 — 이번 단계에서 계산·보고하지 않는다"
  signal:
    description: "2장 #3(63일 상대수익 첫 초과) + #4(거래대금 배율) + #5(장대양봉)이 같은 날 모두 충족(첫 발생)"
    dollar_volume_multiplier_min: 2.0 # #4 주 설정
    big_candle_pct_min: 5.0 # #5 주 설정 (종가 등락률 >= +5%, 종가 > 시가)
    relative_return_window_days: 63
    first_score_window_days: 60
  priority_order:
    - "① 섹터 상대강도 높은 순"
    - "② \"처음\" 점수(직전 60일 초과일 수) 낮은 순"
    - "③ 거래대금 배율 높은 순"
    - "거래대금 상위 10종목은 우선순위 맨 뒤로 미룬다"
  entry:
    description: "신호 다음 날 지정가 = 신호일 종가 × 1.01"
    limit_markup: 1.01
    fill_rule: "시가 <= 지정가면 시가로 체결, 저가 <= 지정가면 지정가로 체결, 아니면 미체결"
  weighting:
    per_position_fraction_of_satellite: 0.1 # 위성 자금의 1/10씩
    max_concurrent_positions: 10
    max_positions_per_sector: 3
  stop:
    description: "종가 < 신호일(장대양봉) 저가 -> 다음 날 시가 매도"
  exit:
    description: "매수 후 63거래일 되는 날의 다음 날 시가 매도"
    hold_trading_days: 63
  reentry:
    description: "같은 종목은 청산 후 20거래일 동안 신규 신호를 무시한다"
    cooldown_trading_days: 20
  satellite_idle_cash: "단기 국채 (합성 자산, P6의 쿨다운 없는 방식 — core.synthetic_assets)"
  portfolio:
    core_pct: 70 # QQQM, 팔지 않음, 배당 재투자
    satellite_pct: 30 # KJB 위성
  costs_and_tax: "P5·P6와 같음 (수수료 매수·매도 각 0.07%, 환전 스프레드 0.1%, 해외주식 양도세 연 250만원 공제 후 22%, 취득가는 이동평균법)"

# ── 3장: 주변값 (한 번에 하나만 바꾼다) ───────────────────────────────────
neighborhood_values:
  dollar_volume_multiplier: {main: 2.0, alternatives: [1.5, 3.0]}
  big_candle_threshold: {main: "종가 등락률 >= +5%", alternative: "20일 일간 변동성의 2.5배 이상 (대형주 맞춤)"}
  stop: {main: "신호일(장대양봉) 저가", alternative: "매수가 -8%"}
  exit: {main: "63거래일 보유 후 청산", alternative: "63일 상대강도가 다시 0 아래로 내려가면 청산"}
  entry_style: {main: "신호 다음 날 지정가(종가x1.01)", alternative: "신호 후 10거래일 안에 신호일 종가 -3% 이하로 눌리면 그 가격에 매수"}

# ── 4장: 비교 대상 (사전 등록) ────────────────────────────────────────────
comparisons:
  random_entry:
    description: >
      같은 날짜·같은 건수·같은 청산 규칙으로 종목만 그날 활성 구성 종목 중
      무작위로 뽑는다. 500회, 고정 시드, 병렬 실행.
    runs: 500
    seed: 20260928 # 사전 등록 시점 날짜(YYYYMMDD)를 그대로 고정 시드로 쓴다
  benchmarks:
    - {name: QQQ, rule: "QQQ 매수 후 보유"}
    - {name: P0, rule: "QQQM 100% 매수 후 보유"}
  our_strategy_in_same_structure:
    name: "코어70 + B0.5(위성) 30"
    description: "B0.5(P5-3 새 기준선, 슬롯 5)를 코어 QQQM 70% + 위성 30% 구조에 그대로 넣은 것"

# ── 4장: 판정 기준 (주 설정에만 적용) ─────────────────────────────────────
criteria:
  applies_to: "주 설정(main_settings)만 — 주변값은 안정성 확인용으로만 쓴다"
  verdicts: ["합격", "보류", "불합격", "표본 부족"]
  insufficient_sample:
    condition: "체결된 포지션이 30건 미만"
    action: "판정하지 않고 \"표본 부족\"으로만 보고한다"
  pass_conditions: # 세 가지 모두 충족해야 "합격"
    - key: random_entry_percentile
      description: "무작위 진입(500회) 분포에서 95백분위 이상"
      min_percentile: 95
    - key: posttax_a_vs_p0
      description: "코어70+KJB위성30 포트폴리오 세후(a) CAGR >= P0(QQQM 100%) 세후(a) CAGR"
    - key: mdd_vs_p0
      description: "코어70+KJB위성30 포트폴리오 MDD(절대값) <= P0 MDD(절대값)"
  verdict_rule:
    합격: "위 세 조건 모두 충족"
    보류: "세 조건 중 두 가지 충족"
    불합격: "세 조건 중 한 가지 이하 충족"
  instability_flag:
    condition: "주변값 결과의 세후(a)가 주 설정 대비 3%p 넘게 나빠짐"
    label: "불안정"
  note: >
    결과를 본 뒤 규칙·기준값을 바꾸지 않는다. 나쁜 결과도 그대로 보고한다.

# ── 5장: 보고용 (판정에 쓰지 않음) ───────────────────────────────────────
reporting_only:
  - "연도별 신호 수와 체결 수 (장대양봉 +5%가 대형주에서 얼마나 드문지)"
  - "섹터별 신호 분포, 섹터 확산도가 높을 때 vs 낮을 때 평균 R"
  - "\"처음\" 점수 구간별(0~10 / 11~30 / 31~60일) 평균 R"
  - "우리 신호(A형 RSI 30 반등)와 같은 날 겹친 종목 수"
  - "대장주 선행 신호(2장 #2)와 이후 20일 QQQ 수익률의 관계 (참고용)"

# ── 6장: 한계 (그대로 보고에 옮긴다) ──────────────────────────────────────
known_limitations:
  - "원자료는 한국 중소·중형주 중심 — 대형주에서는 +5% 장대양봉·거래대금 급증이 드물어 신호가 적을 수 있다"
  - "재무 필터(2장 #15)와 지수 비중 조절(2장 #16)은 이번 시험에서 빠졌다 — 종목 선택 핵심부만 시험한다"
  - "섹터는 yfinance 현재 GICS 분류를 전 기간에 그대로 쓴다 — 과거 실제 분류와 다를 수 있다"
  - "이 백테스트는 사람의 최종 판단 없이 규칙대로만 샀을 때의 결과다"

no_parameter_changes_beyond_scope: true
