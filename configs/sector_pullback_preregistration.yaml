# 탐색 B 「강한 업종 속 강한 종목, 첫 눌림 매수」 사전 등록 (전략공장 v4 첫 탐색 · 판정 아님)
# 2026-10-16 결과 보기 전에 고정. 변형은 B0~B3 4개만, 결과 보고 규칙·숫자를 바꿔 다시 돌리지 않는다.
# 브랜치 research/sector-pullback, main 병합 금지.
id: sector_pullback
status: 탐색 (판정 아님)
fixed_at: "2026-10-16"

universe:
  lists: ["시점별 나스닥100 (data.universe_history)", "S&P 100 (위키 옛 판 매달 말, data/cache/sw1/sp100_monthly.csv)"]
  combine: union
  period: {start: "2012-01-01", end: "2021-12-31"}
  data_guard: "2022-01-01 이후 가격·신호 금지 (코드 가드)"

sectors:
  source: "EDGAR submissions의 SIC 코드"
  map_file: configs/sector_pullback_sic_map.csv
  groups: [기술, 통신, 소비재량, 필수소비, 헬스, 금융, 산업, 에너지, 소재, 유틸리티, 부동산]
  min_members: 3 # 3종목 미만 업종은 그 판정에서 제외

b0:
  strong_sector: "업종 평균 126거래일 수익률 − QQQ 126거래일 수익률 상위 3개 (매주 마지막 거래일 판정)"
  strong_stock: "강한 업종 안, 126거래일 QQQ 대비 초과 > 0 이고 업종 평균보다 높음"
  macd: {fast: 12, slow: 26, signal: 9, cross_within_days: 20} # MACD 선 0선 상향 돌파 후 20거래일 이내
  first_pullback: "돌파 후 고점 대비 −3% 이상, 종가 ≤ 20일선 × 1.01, 종가 > 50일선, MACD > 0"
  buy: "첫 눌림 다음 날 종가, 같은 돌파에서 1회만"
  sell: "먼저 오는 것: 업종이 상위 5개 밖 / 종가 < 50일선 / MACD < 0 → 다음 날 종가"
  portfolio: {max_positions: 10, weight: "총자산 1/10", no_slot: "자리 없음 기록", idle_cash: QQQ}
  costs: {one_way_pct: 0.1, sensitivity_one_way_pct: 0.3, tax: "연 순이익 22%", dividends: "원천 15% 뒤 현금"}

variants:
  B1: "눌림 없이 돌파 다음 날 매수"
  B2: "업종 조건 없이 대상 전체"
  B3: "업종 강도를 63거래일로"

compare: [QQQ, "같은 시점 대상 전체 동일 비중", "같은 날 같은 대상 무작위 1,000회",
          "가짜 신호 조립 대조: 4개 변형을 가짜 신호로 200번 → 가짜 1등 95백분위"]
regime: "QQQ 기준 폭락장(252일 고점 대비 −20% 이하 또는 20일 −10% 이하) > 하락장(200일선 아래) > 상승장(200일선 위), 그날까지 정보만"
next_step_rule: "가짜 1등 95백분위 초과 + 동일 비중보다 높음 + 2012~16·2017~21 두 구간 모두 QQQ 초과인 변형이 있으면 '검증 구역 ③ 판정 제안'만 쓰고 멈춤"

# 0단계 해석
interpretations:
  - "명단 시점: 신호일이 속한 달의 전 달 말 명단 (SW1·봉인 ⓐ와 같은 방법). 0단계 '월 평균 종목 수'도 이 기준으로 센다"
  - "SIC는 EDGAR submissions의 현재 값 하나를 전 기간에 쓴다 (시점별 SIC 이력은 무료로 없음)"
  - "티커→CIK는 SW1 cik.csv(시점별 명단 합집합, 같은 회사 확인 완료)를 쓰고, 없거나 틀린 것은 configs/sector_pullback_cik_candidates.csv(검증 통과 후보)"

# 0단계 뒤 사용자 결정 (2026-10-16, 가격·수익 보기 전)
decisions_after_step0:
  1_sic_map: "4720~4729만 소비재량(여행), 4731 화물 운송 주선을 포함한 나머지 4700대는 산업 — 매핑표 고침"
  2_unmapped: "YHOO는 2016년 무렵 EDGAR 공시 머리글의 당시 SIC(7373, configs/sector_pullback_sic_overrides.csv). CTRX·LILA·LILAK·CTS는 대상에서 제외하고 기록"
  3_share_classes:
    - "같은 회사(같은 CIK)의 여러 주식은 회사당 한 종목으로 계산한다 (업종 평균·매수 후보 모두 회사당 한 번)"
    - "대표 주식 = 가격 기록(상장일 규칙 적용 뒤, 2010-01 ~ 2021-12 거래일 수)이 가장 긴 주식. 같으면 티커 알파벳 순"
    - "대표 주식 가격이 빈 날만 다른 주식을 쓴다"
    - "실제 상장일 전 날짜는 쓰지 않는다: configs/sector_pullback_listing_dates.csv (GOOGL 2014-04-03)"
  4_limits: "현재 SIC 한 값 사용, 부동산이 대부분 3종목 미만으로 빠지는 것 — 한계로 기록하고 그대로 진행"
  5_sw1_blk: "SW1 BLK CIK 오류는 고치지 않고 docs/issues/sw1_blk_cik.md에 기록만. 판정 불변"

# 1단계 해석 (Claude가 결과 보기 전에 고정 — 지시문에 숫자가 없는 부분만, 사용자 확인 대상)
step1_interpretations:
  data:
    - "가격 출처는 CIK가 같은 것만 쓴다: (가) S&P 500 점검 final_gap.csv에서 같은 CIK·status 있음인 출처(yfinance 또는 Tiingo 캐시, Tiingo는 div_cash 포함)
       (나) SEC 현재 티커 목록에서 그 티커(또는 SW1 renames의 바뀐 티커)가 같은 CIK면 yfinance(auto_adjust=False Close·Dividends, 2010-01-01 ~ 2021-12-31)
       (다) SW1 price_check.csv use=True(같은 CIK 확인)인 Tiingo 캐시(분배금 없음 → 0). 그 밖(티커 재사용 위험)은 가격 없음으로 둔다"
    - "가격은 2021-12-31 넘는 줄을 읽지 않는다(코드 가드). 지표 준비용으로 2010-01부터 읽는다"
    - "대표 주식이 빈 날 다른 주식으로 채울 때는 그 주식의 일간 수익률로 이어 붙인다(마지막 공통일 가격 비율로 맞춤) — 두 주식 가격 수준 차이로 생기는 가짜 점프 방지"
    - "분할 반영 종가만 쓴다(배당·분사 미반영). 분사로 생기는 큰 하락은 고치지 않고 일간 ±50% 넘는 움직임 목록으로 보고만 한다"
  universe:
    - "회사는 그달 명단에 그 회사 주식이 하나라도 있으면 대상. 0단계 제외 4종목(CTRX·LILA·LILAK·CTS)과 가격 없는 회사는 빠진다(생존 편향 기록)"
  indicators:
    - "N거래일 수익률 = 오늘 종가 ÷ QQQ 거래일 기준 N거래일 전 종가 − 1 (두 날 모두 종가가 있어야 함). 이동평균·MACD는 회사 자기 종가 열로"
    - "업종 평균 = 그날 대상이면서 N거래일 수익률이 있는 그 업종 회사들의 단순 평균. 그런 회사가 3개 미만이면 그 업종은 그날 순위에서 뺀다"
    - "업종 순위는 매주 마지막 거래일(QQQ 거래일 기준) 종가로 정하고, 다음 판정일 전날까지 그대로 쓴다 (판정일 당일 신호부터 새 순위)"
    - "강한 종목은 신호일(눌림일) 당일 값으로 본다: 126거래일 QQQ 대비 초과 > 0 이고 > 그날 그 업종 126거래일 평균. B3도 종목 조건은 126(업종 순위만 63)"
    - "B2(업종 조건 없음): 강한 업종·업종 평균 비교·업종 매도 조건을 모두 빼고, 126거래일 QQQ 대비 초과 > 0만 남긴다"
  signal:
    - "MACD 0선 상향 돌파일 = 전날 MACD ≤ 0, 오늘 > 0. 돌파일 다음 거래일부터 20거래일 안(돌파일 +1 ~ +20)에서 눌림을 찾고, 중간에 MACD ≤ 0이면 그 돌파는 끝"
    - "고점 = 돌파일부터 그날까지 종가 최고값. 첫 눌림 = 창 안에서 가격 조건 4개(고점 대비 −3% 이하, 종가 ≤ 20일선×1.01, 종가 > 50일선, MACD > 0)가 처음 맞는 날.
       그날 업종·종목 조건이 안 맞으면 그 돌파는 매수 없음 (다음 눌림을 기다리지 않음)"
    - "B1: 돌파일 당일 업종·종목 조건을 보고 돌파 다음 날 종가에 산다"
  trading:
    - "체결은 신호 다음 거래일 종가. 그날 그 회사 종가가 없으면 체결하지 않고 '체결 불가'로 기록"
    - "같은 날 자리보다 신호가 많으면 126거래일 QQQ 대비 초과가 큰 순. 못 산 신호는 '자리 없음'"
    - "매수 금액 = 체결일 종가 기준 총자산 ÷ 10 (현금 먼저, 모자라면 QQQ를 판다). 소수 주식 허용"
    - "매도 조건은 체결 다음 날 종가부터 매일 본다. 맞으면 다음 거래일 종가에 판다. 가격이 끝난 회사(상장폐지 등)는 마지막 종가에 판 것으로 본다. 명단에서 빠져도 매도 조건 전까지 들고 간다"
    - "쉬는 돈: 매일 장 마감 뒤 남은 현금(매도 대금·분배금)을 QQQ로 산다. 비용은 종목·QQQ 매매 모두 편도 0.1%(민감도 0.3%)"
    - "분배금: 배당락일 보유 수량 × 주당 분배금 × 85%를 현금으로"
    - "세금: 그해 마지막 거래일에 그해 실현 순이익(종목+QQQ) × 22%를 현금 → QQQ 순서로 낸다. 손실 이월 없음. 2021-12-31 종가에 전부 청산하고 그해 세금을 뺀 값이 끝 값"
    - "시작: 2012-01-03 종가에 전액 QQQ. 신호도 그날부터. 체결일이 2021-12-31을 넘는 신호는 버린다"
  compare:
    - "QQQ: 2012-01-03 종가에 사서 분배금 85%를 QQQ로 다시 사며 끝까지 보유, 끝 청산·세금"
    - "동일 비중: 매달 첫 거래일 종가에 그달 대상 회사(그날 종가 있음) 전체를 같은 비중으로 다시 맞춘다. 비용·세금·분배금 같은 규칙, 분배금은 다음 재조정까지 현금"
    - "무작위 1,000회(변형마다): 실제 체결된 매매의 매수일·매도일을 그대로 두고 회사만 그날 대상(종가 있음, 신호 회사·그때 보유 회사 제외) 중 무작위. 백분위 = 무작위 연복리가 전략보다 낮은 비율(같으면 반)"
    - "가짜 신호 조립(200번): 매 회차 변형마다 실제 신호 수(자리 없음 포함)만큼 (날짜, 회사)를 무작위로 뽑아(날짜는 기간 거래일 균등, 회사는 그날 대상 균등) 그 변형의 매수·매도·자리 규칙으로 돌린다.
       회차마다 4개 중 가장 높은 연복리 = 가짜 1등. 200개의 95백분위가 기준"
    - "국면: 그날 종가까지의 QQQ로 판정(폭락장 > 하락장 > 상승장), 그날 → 다음 날 수익을 그날 국면에 넣는다. 국면별 일수·누적·연환산을 전략(세전 일별 곡선)과 QQQ로"
    - "구간: 곡선을 자른다(다시 시작하지 않음) 2012-01-03 ~ 2016-12-30, 2016-12-30 ~ 2021-12-31. 연도별 승수 = 그해 수익률이 QQQ보다 높은 해 수"
    - "매매 통계: 끝 청산 포함 완료 매매. 보유일 = 매수 체결일 → 매도 체결일 거래일 수. 승 = 비용 뒤 수익 > 0"
    - "업종별 기여 = 매매 손익(비용 뒤, 세전) 업종별 합 + QQQ(쉬는 돈) 손익"
    - "상위 5건 제외 = 손익 상위 5건만 빼고(그 돈은 QQQ에 둠) 나머지 매매 일정은 그대로 다시 돌린 값"
    - "현재 명단 = 나스닥100(data/universe_fallback.csv, 2026-09-23) ∪ S&P 100(위키 현재 판)을 전 기간에 고정. 같은 규칙·비교는 QQQ·동일 비중(같은 명단)만 (무작위·가짜는 시점별 명단에서만)"

# 1단계 데이터 보완 (2026-10-16, 가격 출처 확보율만 보고 정함 — 수익·신호는 아직 계산 전)
data_amendments:
  1: "(가) S&P 500 점검 final_gap: status 있음이고 그 점검의 CIK가 비었거나 우리 CIK와 같으면, 그 점검이 고른 출처(Tiingo 캐시 또는 yfinance, 바뀐 티커는 renames 기준)를 쓴다 — 그 점검이 날짜·시가총액으로 같은 회사를 확인했기 때문"
  2: "(나') 우리 CIK가 지금 다른 티커로 거래되면(SEC 현재 티커 목록 역조회) 그 티커의 yfinance를 쓴다 (RIMM→BB, VIP→VEON, DWDP→DD 등)"
  3: "(라) 지주회사 개편: 같은 티커의 지금 CIK가 다르고, 그 새 CIK의 EDGAR 이름이 기대 이름과 유사도 0.6 이상이며, 옛 CIK에 지금 거래되는 티커가 없을 때만 그 티커의 yfinance (XOM·AVGO·BLK·APA·PRGO·XRX). 옛 Alcoa(AA)처럼 옛 회사가 다른 티커로 살아 있으면 쓰지 않는다"
  coverage: "가격 없음 23종목(명단 달 합 896, 종목·달의 약 4%) — CA·EMC·YHOO·SNDK·MON·QRTEA·BBBY 등 상장폐지·인수. 생존 편향으로 기록"
  known_limits:
    - "같은 CIK의 트래킹 주식(Liberty Media 1560385: LMCA·LMCK·BATRA·BATRK)은 한 회사로 묶여 FWONA 가격(옛 LMCA 이어짐)을 쓴다"
    - "티커와 CIK의 시점 불일치(FOXA 2012~2019 = 21st Century Fox, DD 2012~2017 = E. I. du Pont 등)는 지금 CIK 기준 — 가격은 같은 주식 흐름(yfinance)을 따른다"
    - "Tiingo 출처(2011-06부터)는 지표 준비 기간이 짧다. SW1 Tiingo 15종목은 분배금 없음"
